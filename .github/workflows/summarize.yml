name: コミット要約の自動生成

on:
  workflow_call:
    inputs:
      base_url:
        description: "OpenRouter のエンドポイント URL"
        required: false
        type: string
        default: "https://openrouter.ai/api/v1"
      model:
        description: "使用する LLM モデル名"
        required: false
        type: string
        default: "openai/gpt-4o-mini"
      summary_dir:
        description: "要約ファイルの保存先ディレクトリ（リポジトリルートからの相対パス）"
        required: false
        type: string
        default: ".github/summaries"
    secrets:
      OPENROUTER_API_KEY:
        description: "OpenRouter の API キー"
        required: false

jobs:
  summarize:
    name: LLM でコミット要約を生成
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install openai

      - name: シークレット受信確認
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY が空です。シークレットが正しく設定されているか確認してください。"
            exit 1
          else
            echo "✅ OPENROUTER_API_KEY を受信しました（先頭8文字: ${OPENROUTER_API_KEY:0:8}...）"
          fi

      - name: 要約スクリプトの実行
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ inputs.base_url }}
          OPENROUTER_MODEL: ${{ inputs.model }}
          SUMMARY_DIR: ${{ inputs.summary_dir }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          cat > /tmp/summarize.py << 'PYTHON_EOF'
          import os
          import subprocess
          import sys
          from datetime import datetime
          from pathlib import Path
          from openai import OpenAI

          def get_git_log(from_sha, to_sha):
              result = subprocess.run(
                  ["git", "log", "--pretty=format:- %h %s%n%b", f"{from_sha}..{to_sha}"],
                  capture_output=True, text=True, check=True,
              )
              return result.stdout.strip()

          def get_git_diff(from_sha, to_sha, max_chars=8000):
              stat = subprocess.run(
                  ["git", "diff", "--stat", f"{from_sha}..{to_sha}"],
                  capture_output=True, text=True, check=True,
              ).stdout
              diff = subprocess.run(
                  ["git", "diff", f"{from_sha}..{to_sha}"],
                  capture_output=True, text=True, check=True,
              ).stdout
              if len(diff) > max_chars:
                  diff = diff[:max_chars] + "\n\n... (差分が大きすぎるため省略されました)"
              return f"### 変更統計\n{stat}\n### 差分詳細\n{diff}"

          def summarize_with_llm(log, diff):
              api_key = os.environ["OPENROUTER_API_KEY"]
              if not api_key:
                  raise ValueError("OPENROUTER_API_KEY が空です")
              print(f"API キー確認: {api_key[:8]}...")
              client = OpenAI(
                  api_key=api_key,
                  base_url=os.environ.get("OPENROUTER_BASE_URL", "https://openrouter.ai/api/v1"),
                  default_headers={
                      "HTTP-Referer": "https://github.com/souri-t/own-reusable-workflows",
                      "X-Title": "Git Commit Summarizer",
                  },
              )
              model = os.environ.get("OPENROUTER_MODEL", "openai/gpt-4o-mini")
              prompt = f"""以下の Git コミット履歴と差分を分析し、日本語で変更内容の要約を Markdown 形式で作成してください。

          ## コミット履歴
          {log}

          ## 変更内容
          {diff}

          ---

          以下の構成で要約してください：

          ### 変更の概要
          変更全体を 1〜3 文で端的に説明してください。

          ### 主な変更点
          具体的な変更内容を箇条書きで記載してください。

          ### 変更の目的・背景
          変更の意図や背景を推測して記載してください。
          """
              response = client.chat.completions.create(
                  model=model,
                  messages=[
                      {"role": "system", "content": "あなたは Git リポジトリの変更履歴を分析し、日本語で分かりやすく要約するエンジニアリングアシスタントです。"},
                      {"role": "user", "content": prompt},
                  ],
                  max_tokens=1024,
              )
              return response.choices[0].message.content

          def resolve_before_sha(before_sha, current_sha):
              zero_sha = "0" * 40
              if before_sha and before_sha != zero_sha:
                  return before_sha
              result = subprocess.run(
                  ["git", "rev-parse", f"{current_sha}~1"],
                  capture_output=True, text=True,
              )
              if result.returncode == 0:
                  return result.stdout.strip()
              return "4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          def main():
              current_sha = os.environ.get("GITHUB_SHA", "HEAD")
              before_sha = resolve_before_sha(os.environ.get("GITHUB_EVENT_BEFORE", ""), current_sha)
              print(f"要約対象: {before_sha[:7]}..{current_sha[:7]}")

              log = get_git_log(before_sha, current_sha)
              if not log:
                  print("新しいコミットがないため要約をスキップします。")
                  sys.exit(0)

              diff = get_git_diff(before_sha, current_sha)
              print("LLM で要約を生成中...")
              summary = summarize_with_llm(log, diff)

              workspace = Path(os.environ.get("GITHUB_WORKSPACE", "."))
              summary_dir = workspace / os.environ.get("SUMMARY_DIR", ".github/summaries")
              summary_dir.mkdir(parents=True, exist_ok=True)

              date_str = datetime.utcnow().strftime("%Y-%m-%d")
              short_sha = current_sha[:7]
              output_path = summary_dir / f"{date_str}-{short_sha}.md"
              content = (
                  f"# コミット要約: {date_str} (`{short_sha}`)\n\n"
                  f"**コミット SHA**: `{current_sha}`  \n"
                  f"**生成日時**: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')} UTC\n\n"
                  "---\n\n"
                  f"{summary}\n"
              )
              output_path.write_text(content, encoding="utf-8")
              print(f"要約を保存しました: {output_path.relative_to(workspace)}")

          if __name__ == "__main__":
              main()
          PYTHON_EOF
          python3 /tmp/summarize.py

      - name: 要約ファイルをコミット・プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${{ inputs.summary_dir }}"
          git diff --staged --quiet && echo "変更なし。スキップします。" || \
            (git commit -m "docs: コミット要約を自動生成 [skip ci]" && git push)
